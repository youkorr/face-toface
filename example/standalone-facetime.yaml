# =============================================================================
# EXEMPLE AUTONOME — FaceTime entre deux ESP32-P4 (Waveshare 7B 1024x600)
# -----------------------------------------------------------------------------
# Config minimale et complète : caméra OV5647 + audio I2S + écran + page d'appel
# LVGL + face2face (vidéo) + intercom (audio/appel) + présence.
#
# Flashez ce fichier sur les DEUX cartes ; changez juste le bloc substitutions.
#   Carte A : device_ip 192.168.1.50 / peer_ip 192.168.1.51
#   Carte B : device_ip 192.168.1.51 / peer_ip 192.168.1.50
# Les pins correspondent à la Waveshare ESP32-P4-WIFI6-TOUCH-LCD-7B.
# =============================================================================

substitutions:
  device_name: facetime-a
  peer_ip: "192.168.1.51"        # IP de l'AUTRE carte
  peer_name: "Salon"

esphome:
  name: ${device_name}

esp32:
  variant: esp32p4
  flash_size: 32MB
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"

psram:
  mode: hex
  speed: 200MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome

# WiFi via le co-processeur ESP-Hosted (ESP32-C6). Les deux cartes sur le même LAN.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

update:
  - platform: esp32_hosted
    name: "ESP32 Hosted Firmware"
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/test2_esp_video_esphome
      ref: claude/nifty-dijkstra-gdUqZ
    components: [esp_video, esp_cam_sensor, lvgl_camera_display]
    refresh: always
  - source:
      type: git
      url: https://github.com/youkorr/lvgl_9.5
      ref: claude/jolly-lamport-ERZOC
    components: [lvgl, image, font]
    refresh: always
  - source:
      type: git
      url: https://github.com/youkorr/face-toface
      ref: claude/esp32p4-video-communication-W0yEc
    components: [face2face]
    refresh: always
  - source: github://n-IA-hane/esphome-intercom
    ref: main
    components: [intercom_api]
    refresh: always

# --- Bus I2C (capteur caméra + codecs audio) --------------------------------
i2c:
  - id: bsp_bus
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz

esp_ldo:
  - { voltage: 2.5V, channel: 3 }
  - { voltage: 2.5V, channel: 4 }

# --- Caméra OV5647 (MIPI-CSI) -----------------------------------------------
esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  xclk_freq: 24000000
  enable_jpeg: true
  enable_isp: true

esp_cam_sensor:
  id: tab5_cam
  i2c_id: bsp_bus
  sensor_type: ov5647
  resolution: "640x480"          # 4:3, bon compromis pour l'appel
  framerate: 30
  jpeg_quality: 15

# --- Audio I2S (ES7210 micro + ES8311 HP) -----------------------------------
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bsp_bus
    address: 0x18
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    sample_rate: 48000
  - platform: resampler        # adapte le 16 kHz du flux vers 48 kHz du HP
    id: media_resampling_speaker
    output_speaker: esp32_speaker
    sample_rate: 48000
    bits_per_sample: 16

# --- VIDÉO P2P (face2face) --------------------------------------------------
face2face:
  id: f2f
  peer_ip: ${peer_ip}
  camera_id: tab5_cam
  enable_audio: false
  width: 640
  height: 480
  framerate: 15
  jpeg_quality: 40

# --- AUDIO + signalisation d'appel (intercom) -------------------------------
intercom_api:
  id: intercom
  microphone: esp32_microphone
  speaker: media_resampling_speaker
  buffers_in_psram: true
  ringing_timeout: 30s
  on_boot:
    priority: -100
    then:
      - intercom_api.flush_contacts: { id: intercom }
      - intercom_api.set_contacts:
          id: intercom
          contacts_csv: "${peer_name}|tcp|${peer_ip}|6054"
  on_ringing:
    - lvgl.widget.show: incoming_overlay
    - lvgl.page.show: call_page
  on_streaming:
    - lambda: "id(f2f).start_call();"
    - lvgl.widget.hide: incoming_overlay
    - lvgl.page.show: call_page
  on_idle:
    - lambda: "id(f2f).stop_call();"
    - lvgl.widget.hide: incoming_overlay

# --- Présence (heartbeat) ---------------------------------------------------
binary_sensor:
  - platform: template
    name: "Pair connecté"
    id: peer_connected
    device_class: connectivity
    lambda: "return id(f2f).peer_online();"

# --- Boutons d'appel --------------------------------------------------------
button:
  - platform: template
    name: "Appeler ${peer_name}"
    on_press:
      - intercom_api.call_contact: { id: intercom, contact: "${peer_name}" }
  - platform: template
    name: "Raccrocher"
    on_press:
      - intercom_api.hangup_call: intercom

# --- Boucle vidéo + présence ------------------------------------------------
interval:
  - interval: 66ms
    then:
      - lambda: |-
          if (id(f2f).has_new_remote_frame()) {
            const uint8_t *rgb = id(f2f).remote_rgb565();
            if (rgb != nullptr) {
              lv_canvas_set_buffer(id(remote_video), (void*)rgb,
                  id(f2f).remote_width(), id(f2f).remote_height(),
                  LV_COLOR_FORMAT_RGB565);
              lv_obj_invalidate(id(remote_video));
            }
          }
          bool on = id(f2f).peer_online();
          lv_obj_set_style_bg_color(id(presence_dot),
              lv_color_hex(on ? 0x22C55E : 0x64748B), 0);
          lv_label_set_text(id(presence_label), on ? "En ligne" : "Hors ligne");

# --- Écran MIPI-DSI ---------------------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin: { number: 33 }
    rotation: 180
    update_interval: never
    auto_clear_enabled: false
    dimensions: { width: 1024, height: 600 }

# --- LVGL : page d'appel ----------------------------------------------------
lvgl:
  color_depth: 16
  byte_order: little_endian
  displays: [main_display]
  pages:
    - id: call_page
      bg_color: 0x0A0E1A
      bg_opa: COVER
      widgets:
        - canvas:
            id: remote_video
            align: CENTER
            width: 640
            height: 480
        - obj:
            align: TOP_MID
            width: 1024
            height: 64
            radius: 0
            border_width: 0
            bg_color: 0x000000
            bg_opa: 45%
            widgets:
              - obj:
                  id: presence_dot
                  align: LEFT_MID
                  x: 24
                  width: 16
                  height: 16
                  radius: 8
                  border_width: 0
                  bg_color: 0x64748B
                  bg_opa: COVER
              - label:
                  align: LEFT_MID
                  x: 52
                  text: "${peer_name}"
                  text_color: 0xFFFFFF
                  text_font: montserrat_22
              - label:
                  id: presence_label
                  align: RIGHT_MID
                  x: -24
                  text: "Hors ligne"
                  text_color: 0x94A3B8
                  text_font: montserrat_16
        - obj:
            align: BOTTOM_MID
            y: -20
            width: 280
            height: 96
            radius: 48
            border_width: 0
            bg_color: 0x000000
            bg_opa: 35%
            widgets:
              - button:
                  align: LEFT_MID
                  x: 16
                  width: 72
                  height: 72
                  radius: 36
                  bg_color: 0x22C55E
                  widgets:
                    - label: { align: CENTER, text: "\U0000e90a", text_font: montserrat_28, text_color: 0xFFFFFF }
                  on_click:
                    - intercom_api.call_contact: { id: intercom, contact: "${peer_name}" }
              - button:
                  align: RIGHT_MID
                  x: -16
                  width: 72
                  height: 72
                  radius: 36
                  bg_color: 0xEF4444
                  widgets:
                    - label: { align: CENTER, text: "\U0000e909", text_font: montserrat_28, text_color: 0xFFFFFF }
                  on_click:
                    - intercom_api.hangup_call: intercom
        - obj:
            id: incoming_overlay
            hidden: true
            align: CENTER
            width: 1024
            height: 600
            radius: 0
            border_width: 0
            bg_color: 0x0A0E1A
            bg_opa: 80%
            widgets:
              - label:
                  align: CENTER
                  y: -120
                  text: "Appel entrant"
                  text_color: 0xFFFFFF
                  text_font: montserrat_28
              - label:
                  align: CENTER
                  y: -70
                  text: "${peer_name}"
                  text_color: 0x94A3B8
                  text_font: montserrat_22
              - button:
                  align: CENTER
                  x: -90
                  y: 60
                  width: 88
                  height: 88
                  radius: 44
                  bg_color: 0x22C55E
                  widgets:
                    - label: { align: CENTER, text: "\U0000e90a", text_font: montserrat_28, text_color: 0xFFFFFF }
                  on_click:
                    - intercom_api.answer_call: intercom
                    - lvgl.widget.hide: incoming_overlay
              - button:
                  align: CENTER
                  x: 90
                  y: 60
                  width: 88
                  height: 88
                  radius: 44
                  bg_color: 0xEF4444
                  widgets:
                    - label: { align: CENTER, text: "\U0000e909", text_font: montserrat_28, text_color: 0xFFFFFF }
                  on_click:
                    - intercom_api.decline_call: intercom
                    - lvgl.widget.hide: incoming_overlay
