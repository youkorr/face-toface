# =============================================================================
# face2face — exemple ESPHome pour ESP32-P4 (OV5647 + MIPI-DSI + LVGL 9.5)
# -----------------------------------------------------------------------------
# Flashez ce MÊME fichier sur les DEUX cartes, en changeant uniquement le bloc
# `substitutions` ci-dessous (nom + IP du pair). Chaque carte appelle l'autre.
#
#   Carte A : device_ip 192.168.1.50  /  peer_ip 192.168.1.51
#   Carte B : device_ip 192.168.1.51  /  peer_ip 192.168.1.50
# =============================================================================

substitutions:
  device_name: face2face-a
  peer_ip: "192.168.1.51"        # <-- IP de l'AUTRE carte
  video_w: "640"
  video_h: "480"
  fps: "15"

esphome:
  name: ${device_name}
  # ESP32-P4 a besoin de beaucoup de PSRAM pour les buffers vidéo.
  platformio_options:
    board_build.flash_mode: qio

esp32:
  board: esp32-p4-function-ev-board
  framework:
    type: esp-idf
    # ESP-IDF >= 5.4 requis pour esp_video / MIPI-CSI sur le P4.
    version: recommended
    sdkconfig_options:
      CONFIG_SPIRAM_MODE_HEX: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      # Tâche principale plus grande : sockets + codecs.
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"

psram:
  mode: hex
  speed: 200MHz

logger:
  level: INFO

# --- Réseau -----------------------------------------------------------------
# L'ESP32-P4 n'a pas de WiFi : il faut un co-processeur (ESP32-C6/C5) en
# ESP-Hosted, OU l'Ethernet de la carte d'éval. Ici : Ethernet intégré.
ethernet:
  type: IP101            # adaptez à votre PHY (ou utilisez `wifi:` + esp-hosted)
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk_mode: GPIO50_OUT
  phy_addr: 1
  manual_ip:
    static_ip: 192.168.1.50    # <-- IP de CETTE carte
    gateway: 192.168.1.1
    subnet: 255.255.255.0

api:
ota:
  - platform: esphome

# --- Composant custom face2face ---------------------------------------------
external_components:
  - source:
      type: local
      path: ../components

face2face:
  id: f2f
  peer_ip: ${peer_ip}
  video_port: 9000
  audio_port: 9001
  width: ${video_w}
  height: ${video_h}
  framerate: ${fps}
  jpeg_quality: 80
  enable_audio: true
  audio_sample_rate: 16000

# --- Affichage MIPI-DSI + LVGL ----------------------------------------------
# (Configuration display dépendante de votre dalle ; exemple générique.)
# display:
#   - platform: mipi_dsi
#     id: main_display
#     ...

# Un canvas LVGL plein écran reçoit l'image distante décodée (RGB565).
# Voir le README pour le lambda qui copie f2f->remote_rgb565() dans le canvas.
# lvgl:
#   displays: [main_display]
#   pages:
#     - id: call_page
#       widgets:
#         - canvas:
#             id: remote_video
#             width: ${video_w}
#             height: ${video_h}

# --- Boutons d'appel (exposés à Home Assistant et/ou LVGL) ------------------
button:
  - platform: template
    name: "Appeler"
    on_press:
      - lambda: "id(f2f).start_call();"
  - platform: template
    name: "Raccrocher"
    on_press:
      - lambda: "id(f2f).stop_call();"

# Pousse la dernière image distante dans le canvas LVGL, ~ à la cadence vidéo.
interval:
  - interval: 66ms    # ~15 fps
    then:
      - lambda: |-
          if (id(f2f).has_new_remote_frame()) {
            const uint8_t *rgb = id(f2f).remote_rgb565();
