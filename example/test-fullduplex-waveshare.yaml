# =============================================================================
# TEST FULL-DUPLEX — WAVESHARE ESP32-P4 7B (ES7210 + ES8311)
# -----------------------------------------------------------------------------
# BUT : vérifier que esp_audio_stack permet micro + HP EN MÊME TEMPS.
# Test : lancez l'assistant vocal ; pendant qu'il PARLE, dites le mot d'éveil.
#   - s'il vous ENTEND pendant qu'il parle  -> FULL-DUPLEX OK ✅
#   - "Parent bus is busy" / il ne vous entend pas -> à ajuster.
#
# Config minimale (audio + VA + wifi). PINS = votre Waveshare P4 7B.
# Cette carte (ES7210+ES8311) est officiellement supportée par esp_audio_stack.
# =============================================================================

substitutions:
  name: ws-fdtest

esphome:
  name: ${name}
  # Ce projet tire 2 piles ML (esp-dl/tflite + esp-sr/tflite) : la compilation
  # est lourde. Limiter à 1 process évite "cc1plus: fatal error: Killed" (OOM).
  # Plus lent mais va au bout. Montez à 2 si votre machine a assez de RAM.
  compile_process_limit: 1

esp32:
  variant: esp32p4
  flash_size: 32MB
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      # esp_audio_stack peut bloquer la loopTask au démarrage -> task_wdt.
      # On désactive le watchdog (l'audio est une tâche temps-réel légitime).
      CONFIG_ESP_TASK_WDT_EN: "n"

psram:
  mode: hex
  speed: 200MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# WiFi via ESP-Hosted C6 (adaptez si votre bloc diffère)
esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO20
  d1_pin: GPIO21
  d2_pin: GPIO22
  d3_pin: GPIO23
  reset_pin: GPIO15
  use_psram: true
  slot: 1

external_components:
  - source: github://n-IA-hane/esphome-intercom@v2026.6.0
    components: [esp_audio_stack, esp_afe]
    refresh: always

i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

# --- Front-end audio — SINGLE MIC (plus simple, micro fournit des données) ---
# Le dual-mic TDM (mic_slots=[0,2]) donnait "AFE Ringbuffer empty" = le feed I2S
# ne captait rien sur les slots. On simplifie : 1 micro, pas de TDM.
esp_afe:
  id: afe_processor
  type: fd
  mode: low_cost
  mic_num: 1
  input_format: MNR         # 1 mic (M) + unused (N) + reference (R)
  aec_enabled: false
  aec_off_output: raw_0     # single mic -> raw_0
  se_enabled: false         # SE/BSS inutile en mono
  ns_enabled: true
  vad_enabled: false
  continuous_vad: true
  agc_enabled: true         # gain auto : relève la voix faible (fix stt-no-text)
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

# --- UN SEUL driver I2S full-duplex (pins Waveshare P4 7B) ---
esp_audio_stack:
  id: audio_stack
  audio_task_stack_in_psram: true
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO12
  i2s_mclk_pin: GPIO13
  i2s_din_pin: GPIO11
  i2s_dout_pin: GPIO9
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: afe_processor
  codec:
    i2c_id: bsp_bus
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x01      # 1 seul micro (canal 0)
      gain_db: 37.5           # gain micro élevé (ES7210 max ~42dB)
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  slot_bit_width: 16
  use_tdm_reference: false   # pas de TDM : référence d'écho logicielle
  buffers_in_psram: true

microphone:
  - platform: esp_audio_stack
    id: esp32_microphone
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: esp32_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000

media_player:
  - platform: speaker
    name: "FD Test Media"
    id: test_media_player
    announcement_pipeline:
      speaker: esp32_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1

micro_wake_word:
  id: mww
  models:
    - model: alexa

voice_assistant:
  id: va
  microphone: esp32_microphone
  media_player: test_media_player
  micro_wake_word: mww
  # PAS de stop micro pendant la réponse : on VEUT vérifier le full-duplex.
  on_tts_start:
    - logger.log: "TTS en cours — DITES LE MOT D'EVEIL MAINTENANT pour tester le full-duplex"

# Bouton pour forcer une annonce (TTS) et tester pendant qu'il parle.
button:
  - platform: template
    name: "FD: dire une phrase"
    on_press:
      - voice_assistant.start:
