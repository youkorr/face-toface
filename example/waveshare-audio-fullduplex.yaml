# =============================================================================
# AUDIO FULL-DUPLEX — WAVESHARE ESP32-P4 7B — via esp_audio_stack
# -----------------------------------------------------------------------------
# RÉSOUT le "Parent bus is busy" : micro + HP partagent un seul bus I2S, et
# ESPHome interdit 2 composants i2s_audio actifs dessus simultanément (le HP
# ne démarre jamais pendant un appel). Solution (n-IA-hane/esphome-intercom
# v2026.6.0) : esp_audio_stack = UN seul driver qui possède le bus I2S en
# full-duplex et expose microphone + speaker STANDARDS + AEC matérielle (TDM).
#
# ✅ COMPATIBLE AVEC VOTRE STACK VA : esp_audio_stack fournit un microphone et
#    un speaker ESPHome normaux. En gardant les MÊMES ids (esp32_microphone /
#    esp32_speaker), toute votre chaîne reste INCHANGÉE :
#       mixer / resampler / media_player / voice_assistant / micro_wake_word
#    s'empilent par-dessus exactement comme avant.
#
# ⚠️ CE QUE VOUS REMPLACEZ dans waveshare.yaml (UNIQUEMENT ces blocs) :
#       - i2s_audio:        (tout le bloc)
#       - audio_dac:        (es8311)
#       - audio_adc:        (es7210)
#       - microphone: -> le SEUL item "platform: i2s_audio" (esp32_microphone)
#       - speaker:    -> le SEUL item "platform: i2s_audio" (esp32_speaker)
#    GARDEZ les blocs mixer/resampler/media_player/voice_assistant/mWW tels quels.
#
# ⚠️⚠️ CONFLIT esp-sr — TRÈS IMPORTANT ⚠️⚠️
# esp_audio_stack tire DÉJÀ esp-sr (pour son AEC matérielle). Si face2face a
# aussi enable_aec: true, il tire un 2e esp-sr -> erreur de build :
#   "Requirement esp-sr and espressif__esp-sr are both added"
# => Avec esp_audio_stack, face2face DOIT avoir enable_aec: false (ci-dessous).
#    L'écho est annulé par le SE/BSS dual-mic de esp_afe, pas par face2face.
# =============================================================================

external_components:
  - source: github://n-IA-hane/esphome-intercom@v2026.6.0
    components: [esp_audio_stack, esp_afe]
    refresh: always
  - source:
      type: git
      url: https://github.com/youkorr/face-toface
      ref: claude/esp32p4-video-communication-W0yEc
    components: [face2face]
    refresh: always

# Front-end audio (AEC matérielle). Voir le repo pour les options NS/VAD/AGC.
esp_afe:
  id: afe_processor
  type: fd
  mode: low_cost
  mic_num: 2
  input_format: MMNR
  aec_enabled: false
  aec_off_output: raw_1
  aec_filter_length: 4
  aec_nlp_level: normal
  se_enabled: true
  ns_enabled: true
  vad_enabled: false
  continuous_vad: true
  agc_enabled: false
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

# --- UN SEUL driver I2S full-duplex (remplace i2s_audio + dac + adc) ---------
esp_audio_stack:
  id: audio_stack
  audio_task_stack_in_psram: true
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO12
  i2s_mclk_pin: GPIO13
  i2s_din_pin: GPIO11
  i2s_dout_pin: GPIO9
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: afe_processor
  codec:
    i2c_id: bsp_bus              # votre bus I2C existant (SDA7/SCL8)
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: 30.0
      ref_channel: 1
      ref_gain_db: 0.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  slot_bit_width: 16
  use_tdm_reference: true        # référence d'écho MATÉRIELLE (AEC propre)
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]
  tdm_ref_slot: 1
  buffers_in_psram: true

# --- mic + HP exposés par le stack, MÊMES ids qu'avant ----------------------
# => votre mixer / resampler / media_player / voice_assistant marchent sans
#    modification (ils référencent esp32_microphone et esp32_speaker).
microphone:
  - platform: esp_audio_stack
    id: esp32_microphone
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: esp32_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000

  # >>> GARDEZ vos blocs existants tels quels juste après <<< :
  # - platform: mixer        (mixing_speaker -> output_speaker: esp32_speaker)
  # - platform: resampler    (announcement_resampling_speaker / media_resampling_speaker)

# --- face2face : audio géré par le stack (AEC matérielle) -------------------
# enable_aec: false car esp_audio_stack fait DÉJÀ l'AEC matérielle (ne pas la
# faire deux fois). Le HP de l'appel : utilisez media_resampling_speaker comme
# avant (il s'empile sur esp32_speaker).
face2face:
  id: f2f
  camera_id: tab5_cam
  microphone_id: esp32_microphone
  speaker_id: media_resampling_speaker
  enable_audio: true
  audio_sample_rate: 16000
  enable_aec: false              # AEC déléguée au matériel (esp_audio_stack)
  audio_start_delay: 300ms       # un seul driver de bus -> plus de "bus busy"
  scale: 2
  jpeg_quality: 35
  framerate: 12
  swap_colors: true
  ring_timeout: 30s
  on_ringing:
    - lvgl.widget.show: incoming_overlay
    - lvgl.page.show: call_page
  on_streaming:
    - micro_wake_word.stop:
    - voice_assistant.stop:
    - lambda: "id(camera_display)->set_enabled(false);"
    - lvgl.widget.hide: incoming_overlay
    - lvgl.page.show: call_page
  on_idle:
    - lambda: "id(camera_display)->set_enabled(true);"
    - micro_wake_word.start:
    - lvgl.widget.hide: incoming_overlay

# -----------------------------------------------------------------------------
# IMPORTANT : les champs exacts d'esp_audio_stack / audio_processor peuvent
# varier selon la version. En cas d'erreur de validation, copiez le bloc depuis
# l'exemple officiel de VOTRE carte :
#   yamls/full-experience/single-bus/waveshare-p4-touch-full-afe-udp-landscape.yaml
#   (https://github.com/n-IA-hane/esphome-intercom)
# -----------------------------------------------------------------------------
