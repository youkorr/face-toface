# =============================================================================
# TEST FULL-DUPLEX — HABBIT Desk PRO (ES8388 + ES7210)
# -----------------------------------------------------------------------------
# BUT : vérifier que esp_audio_stack permet micro + HP EN MÊME TEMPS.
# Test : pendant que l'assistant PARLE, dites le mot d'éveil -> doit vous entendre.
#
# ⚠️ ATTENTION : le habbit utilise un ES8388 (DAC) + ES7210 (ADC). esp_audio_stack
# est officiellement testé avec ES8311/ES7210 ; le support ES8388 N'EST PAS
# confirmé. Ce fichier propose 2 variantes — essayez A, puis B si A échoue.
#
# PINS = votre Habbit : i2c sda31/scl32 ; I2S lrclk29/bclk27/mclk30/din28/dout26.
# =============================================================================

substitutions:
  name: hb-fdtest

esphome:
  name: ${name}

esp32:
  variant: esp32p4
  flash_size: 16MB
  board: esp32-p4-evboard
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    components:
      - espressif/esp_hosted==2.12.8
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO12
  cmd_pin: GPIO13
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8
  reset_pin: GPIO15
  use_psram: true
  slot: 1

external_components:
  - source: github://n-IA-hane/esphome-intercom@v2026.6.0
    components: [esp_audio_stack, esp_afe]
    refresh: always

i2c:
  - id: bsp_bus
    sda: GPIO31
    scl: GPIO32
    frequency: 400kHz

esp_afe:
  id: afe_processor
  type: fd
  mode: low_cost
  mic_num: 2
  input_format: MMNR
  aec_enabled: false
  aec_off_output: raw_1
  aec_filter_length: 4
  aec_nlp_level: normal
  se_enabled: true
  ns_enabled: true
  vad_enabled: false
  continuous_vad: true
  agc_enabled: false
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

# ============================================================================
# VARIANTE A — esp_audio_stack avec ES8388 (à essayer en PREMIER)
# Si esp_audio_stack n'accepte pas type: es8388 -> erreur de validation -> B.
# ============================================================================
esp_audio_stack:
  id: audio_stack
  audio_task_stack_in_psram: true
  i2s_lrclk_pin: GPIO29
  i2s_bclk_pin: GPIO27
  i2s_mclk_pin: GPIO30
  i2s_din_pin: GPIO28
  i2s_dout_pin: GPIO26
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: afe_processor
  codec:
    i2c_id: bsp_bus
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: 30.0
      ref_channel: 1
      ref_gain_db: 0.0
    output:
      type: es8388        # <-- si rejeté, passez à la VARIANTE B (ci-dessous)
      address: 0x10
      use_mclk: true
  slot_bit_width: 16
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]
  tdm_ref_slot: 1
  buffers_in_psram: true

microphone:
  - platform: esp_audio_stack
    id: esp32_microphone
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: esp32_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000

media_player:
  - platform: speaker
    name: "FD Test Media"
    id: test_media_player
    announcement_pipeline:
      speaker: esp32_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1

micro_wake_word:
  id: mww
  models:
    - model: okay_nabu

voice_assistant:
  id: va
  microphone: esp32_microphone
  media_player: test_media_player
  micro_wake_word: mww
  on_tts_start:
    - logger.log: "TTS en cours — DITES LE MOT D'EVEIL pour tester le full-duplex"

button:
  - platform: template
    name: "FD: dire une phrase"
    on_press:
      - voice_assistant.start:

# ============================================================================
# VARIANTE B — si l'ES8388 n'est pas supporté par esp_audio_stack
# ----------------------------------------------------------------------------
# Option B1 : initialiser l'ES8388 séparément via l'audio_dac ESPHome standard,
#   puis utiliser esp_audio_stack en mode "generic" (sans bloc codec interne),
#   le DAC/ADC étant déjà configurés sur le bus I2C. Décommentez ci-dessous et
#   supprimez le bloc 'codec:' de la VARIANTE A.
#
# audio_dac:
#   - platform: es8388
#     id: es8388_dac
#     i2c_id: bsp_bus
# audio_adc:
#   - platform: es7210
#     id: es7210_adc
#     i2c_id: bsp_bus
#
# (puis dans esp_audio_stack, retirer 'codec:' — voir le YAML officiel
#  generic-s3-full-aec-tcp.yaml du repo pour le mode sans codec interne.)
#
# Option B2 (repli sûr) : RESTER en half-duplex sur le habbit pour l'instant
#   (votre config i2s_audio actuelle) et n'utiliser le full-duplex que sur le
#   Waveshare, le temps de confirmer le support ES8388.
# ============================================================================
